services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      BACKEND_CORS_ORIGINS: '["*"]'
      LLM_ENABLE_ENHANCEMENT: "true"
      LLM_PROVIDER: gemini
      LLM_MODEL: gemini-2.5-flash
      LLM_TIMEOUT_SECONDS: "20"
      LLM_MAX_TOKENS: "220"
      TTS_ENABLED: "true"
      TTS_WARMUP_ON_STARTUP: "true"
      TTS_SEGMENT_PAUSE_MS: "400"
    ports:
      - "8000:8000"
    volumes:
      - backend_hf_cache:/root/.cache/huggingface
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: trainup_db
      POSTGRES_USER: trainup_user
      POSTGRES_PASSWORD: trainup_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trainup_user -d trainup_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  backend_hf_cache:
